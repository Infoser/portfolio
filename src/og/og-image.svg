<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="JetBrains Mono, Fira Code, ui-monospace, Menlo, Consolas, monospace">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0d0d12"/>

  <!-- Ambient accent glows -->
  <circle cx="120" cy="120" r="240" fill="#34d399" opacity="0.08"/>
  <circle cx="1080" cy="540" r="260" fill="#ec4899" opacity="0.07"/>

  <!-- Outer editor frame -->
  <rect x="60" y="60" width="1080" height="510" rx="10" fill="#1a1a22" stroke="#28282f" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="60" y="60" width="1080" height="36" rx="10" fill="#16161e"/>
  <rect x="60" y="86" width="1080" height="10" fill="#16161e"/>
  <!-- macOS traffic lights -->
  <circle cx="84" cy="78" r="6" fill="#ff5f57"/>
  <circle cx="104" cy="78" r="6" fill="#febc2e"/>
  <circle cx="124" cy="78" r="6" fill="#28c840"/>
  <!-- Title bar brand block (right) -->
  <rect x="1110" y="72" width="6" height="12" fill="#34d399"/>
  <rect x="1118" y="72" width="6" height="12" fill="#f5b800"/>
  <rect x="1126" y="72" width="6" height="12" fill="#ec4899"/>
  <!-- Title bar text -->
  <text x="600" y="83" text-anchor="middle" font-size="13" letter-spacing="3" fill="#8a8a94">
    ISHAN-PORTFOLIO — workspace
  </text>

  <!-- Sidebar background -->
  <rect x="60" y="96" width="220" height="474" fill="#16161e"/>

  <!-- Sidebar header -->
  <text x="80" y="124" font-size="11" letter-spacing="2.5" fill="#6b6b76">EXPLORER</text>

  <!-- Sidebar entries (8 sections + projects subitem) -->
  <g font-size="14">
    <!-- about.md active -->
    <rect x="76" y="142" width="188" height="22" fill="#34d399" opacity="0.12"/>
    <text x="92" y="158" fill="#34d399">▸ about.md</text>

    <text x="92" y="184" fill="#a8a8b4">▸ experience.folder</text>
    <text x="92" y="210" fill="#a8a8b4">▸ projects.folder</text>
    <text x="92" y="236" fill="#a8a8b4">▸ achievements.folder</text>
    <text x="92" y="262" fill="#a8a8b4">▸ skills.json</text>
    <text x="92" y="288" fill="#a8a8b4">▸ education.folder</text>
    <text x="92" y="314" fill="#a8a8b4">▸ leadership.folder</text>
    <text x="92" y="340" fill="#a8a8b4">▸ contact.toml</text>
  </g>

  <!-- Sidebar divider -->
  <line x1="280" y1="96" x2="280" y2="570" stroke="#28282f" stroke-width="1"/>

  <!-- Editor area tab strip -->
  <rect x="280" y="96" width="860" height="36" fill="#16161e"/>
  <rect x="300" y="104" width="120" height="22" rx="4" fill="#1a1a22" stroke="#28282f" stroke-width="1"/>
  <text x="312" y="120" font-size="12" fill="#a8a8b4">about.md</text>
  <circle cx="406" cy="116" r="3" fill="#8a8a94"/>

  <!-- Cursor blink line in editor area -->
  <rect x="316" y="240" width="2" height="20" fill="#34d399"/>

  <!-- Pixel-eye cursor (reused from favicon, scaled) -->
  <g transform="translate(620, 360) scale(6)" shape-rendering="crispEdges">
    <g fill="#0d0d12">
      <rect x="6" y="0" width="2" height="2"/><rect x="8" y="0" width="2" height="2"/><rect x="10" y="0" width="2" height="2"/>
      <rect x="2" y="2" width="2" height="2"/><rect x="4" y="2" width="2" height="2"/><rect x="6" y="2" width="2" height="2"/><rect x="8" y="2" width="2" height="2"/><rect x="10" y="2" width="2" height="2"/><rect x="12" y="2" width="2" height="2"/>
      <rect x="0" y="4" width="2" height="2"/><rect x="2" y="4" width="2" height="2"/><rect x="4" y="4" width="2" height="2"/><rect x="6" y="4" width="2" height="2"/><rect x="8" y="4" width="2" height="2"/><rect x="10" y="4" width="2" height="2"/><rect x="12" y="4" width="2" height="2"/><rect x="14" y="4" width="2" height="2"/>
      <rect x="0" y="6" width="2" height="2"/><rect x="2" y="6" width="2" height="2"/><rect x="4" y="6" width="2" height="2"/><rect x="6" y="6" width="2" height="2"/><rect x="8" y="6" width="2" height="2"/><rect x="10" y="6" width="2" height="2"/><rect x="12" y="6" width="2" height="2"/><rect x="14" y="6" width="2" height="2"/>
      <rect x="0" y="8" width="2" height="2"/><rect x="2" y="8" width="2" height="2"/><rect x="4" y="8" width="2" height="2"/><rect x="6" y="8" width="2" height="2"/><rect x="8" y="8" width="2" height="2"/><rect x="10" y="8" width="2" height="2"/><rect x="12" y="8" width="2" height="2"/><rect x="14" y="8" width="2" height="2"/>
      <rect x="0" y="10" width="2" height="2"/><rect x="2" y="10" width="2" height="2"/><rect x="4" y="10" width="2" height="2"/><rect x="6" y="10" width="2" height="2"/><rect x="8" y="10" width="2" height="2"/><rect x="10" y="10" width="2" height="2"/><rect x="12" y="10" width="2" height="2"/>
      <rect x="0" y="12" width="2" height="2"/><rect x="2" y="12" width="2" height="2"/><rect x="4" y="12" width="2" height="2"/><rect x="6" y="12" width="2" height="2"/><rect x="8" y="12" width="2" height="2"/><rect x="10" y="12" width="2" height="2"/>
      <rect x="4" y="14" width="2" height="2"/><rect x="6" y="14" width="2" height="2"/><rect x="8" y="14" width="2" height="2"/><rect x="10" y="14" width="2" height="2"/>
      <rect x="8" y="16" width="2" height="2"/><rect x="10" y="16" width="2" height="2"/>
      <rect x="10" y="18" width="2" height="2"/>
    </g>
    <g fill="#ffffff">
      <rect x="4" y="4" width="2" height="2"/><rect x="10" y="4" width="2" height="2"/>
    </g>
    <g fill="#34d399">
      <rect x="4.6" y="4.6" width="0.8" height="0.8"/><rect x="10.6" y="4.6" width="0.8" height="0.8"/>
    </g>
  </g>

  <!-- Main headline -->
  <text x="320" y="200" font-size="14" letter-spacing="3" fill="#6b6b76">// PORTFOLIO</text>
  <text x="316" y="262" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="68" font-weight="500" fill="#f4f4f5">Ishan Kumar Sahu</text>

  <!-- Tagline -->
  <text x="320" y="320" font-size="22" fill="#a8a8b4">ML / DL researcher · deepfake detection · low-resource NLP · edge AI</text>

  <!-- Project badges row -->
  <g font-size="13" letter-spacing="0.5">
    <rect x="320" y="350" width="170" height="32" rx="16" fill="none" stroke="#34d399" stroke-width="1.2"/>
    <text x="405" y="370" text-anchor="middle" fill="#34d399">SHRUTIAI · SIH 2025</text>

    <rect x="500" y="350" width="190" height="32" rx="16" fill="none" stroke="#f5b800" stroke-width="1.2"/>
    <text x="595" y="370" text-anchor="middle" fill="#f5b800">BINSENSE · ₹2L DST</text>

    <rect x="700" y="350" width="200" height="32" rx="16" fill="none" stroke="#ec4899" stroke-width="1.2"/>
    <text x="800" y="370" text-anchor="middle" fill="#ec4899">AKSHARDHARA · NLLB-200</text>
  </g>

  <!-- Sub-caption below emphasising resume-relevant signal -->
  <text x="320" y="420" font-size="15" fill="#6b6b76">B.Tech CSE (Data Science) · BIT Durg · MIST Lab, IIT Bhilai</text>

  <!-- Status bar -->
  <rect x="60" y="546" width="1080" height="24" fill="#34d399"/>
  <text x="80" y="562" font-size="11" fill="#0d0d12" letter-spacing="1">● main</text>
  <text x="600" y="562" text-anchor="middle" font-size="11" fill="#0d0d12" letter-spacing="2">PORTFOLIO · VERCEL · SUPABASE · REACT 19 · VITE 8</text>
  <text x="1116" y="562" text-anchor="end" font-size="11" fill="#0d0d12">ITE 8</text>
</svg>
