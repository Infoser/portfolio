    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #fafaf7;
        color: #0d0d12;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 0.875rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        transition: opacity 400ms ease-out;
      }
      @media (prefers-color-scheme: dark) {
        #boot-loader {
          background: #0d0d12;
          color: #fafaf7;
        }
      }
      #boot-loader.boot-hidden {
        opacity: 0;
        pointer-events: none;
      }
      .boot-dots {
        display: inline-flex;
        gap: 0.5rem;
      }
      .boot-dots span {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 9999px;
        background: currentColor;
        opacity: 0.3;
        animation: boot-pulse 1.2s ease-in-out infinite;
      }
      .boot-dots span:nth-child(2) { animation-delay: 0.15s; }
      .boot-dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes boot-pulse {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1); }
      }
      .boot-label {
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-loader" aria-hidden="true">
      <div class="boot-dots" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <div class="boot-label">Loading workspace…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
